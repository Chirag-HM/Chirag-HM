name: Generate Snake

on:
schedule:
- cron: "0 */12 * * *"
workflow_dispatch:

jobs:
generate:
permissions:
contents: write

```
runs-on: ubuntu-latest

steps:
  - uses: Platane/snk@v3
    with:
      github_user_name: Chirag-HM
      outputs: |
        dist/github-snake-dark.svg?palette=github-dark&color_snake=%238A2BE2&color_dots=%23ffffff,%23ffffff,%23d9d9d9,%23bfbfbf,%23999999

  - uses: crazy-max/ghaction-github-pages@v4
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
